<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
    body {
        font-family: Arial, Helvetica, 
sans-serif;
    }
    table {
        width: 400px;
        height: 200px;
       border-collapse: collapse;
       position: relative
    }
    th {
        background-color: gray;
        height: 50px;
        width: 100px;
        color: white;
    }
    tfoot {
        background-color: gray;
        color: white;
    }
    thead > tr > th {
        position: sticky;
    }
    td {
        border: 1px solid black;
        padding: 8px;
        text-align: left; /*alinhamento 
        herizontal*/
        vertical-align: middle; /*alinhamento 
        vertical*/
    }
    
    .numero {
        text-align: right;
    }

    caption {

    }
    tbody > tr:nth-child(even) {
        background-color: lightgray;
    }
</style>
</head>
<body>
    <h1>Uso de Tabelas Grandes</h1>
    <!--
        Anatomia para Tabelas Grandes
            TABLE
                CAPTION
                TR, TD, TH
            TBOBY
                TR, TD, TH
            TFOOT
                TR, TD, TH
    -->

    <Table>
        <caption>População das Unidades Federativas</caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col">População</th>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <th scope="row">Total de Habitantes</th>
                <td>210.147.125</td>
            </tr>
        </tfoot>
        <tbody>
            <tr>
                <td>São paulo</td>
                <td>45.919.049</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td>21.198.791</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td>17.264.943</td>
            </tr>
        </tbody>
    </Table>
</body>
</html>
